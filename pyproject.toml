[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26083-heat-risk"
version = "1.0.0"
description = "Extreme Heatwave Early Warning and Human Thermal Stress Index Engine (SIH26083 - MoES/NCMRWF)"
readme = "README.md"
authors = [{ name = "SIH26083 Engineering Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
